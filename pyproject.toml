[project]
name = "alpr"
version = "0.1.0"
description = "Automatic license plate recognition (ALPR) for Argentine Mercosur plates from a single RTSP camera — CPU-only, 100% FOSS ONNX stack."
requires-python = ">=3.12"
dependencies = [
  # Pinned stack (see docs/adr/0002-onnx-runtime-cpu-baseline.md): ONNX Runtime CPU baseline,
  # OpenVINOExecutionProvider attempted first when installed. No PyTorch, no Ultralytics.
  "onnxruntime>=1.19.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.10.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-dotenv>=1.0.0",
  "imageio-ffmpeg>=0.5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
