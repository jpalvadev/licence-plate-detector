<!doctype html>
<meta charset="utf-8">
<title>ALPR — Argentine plates</title>
<style>
  body { background:#111; color:#ddd; font-family:monospace; margin:12px; }
  img.stream { width:100%; border:1px solid #555; }
  table { border-collapse:collapse; width:100%; }
  th, td { border:1px solid #444; padding:3px 6px; font-size:12px; }
  thead th { background:#232323; }
  .car { color:#6f6; } .legacy { color:#fc6; }
</style>

<img class="stream" id="stream" src="/stream" alt="live stream">

<h3>Events log</h3>
<table id="log"><thead><tr>
  <th>timestamp</th><th>patente</th><th>status</th><th>confidence</th>
</tr></thead><tbody id="tbody"><tr><td colspan="4">loading…</td></tr></tbody></table>
<a href="/plates.csv" download="events.csv">download events.csv</a>

<script>
// Display confidence: calibrated display scale mirroring the alpr/clarity.py anchors; the CSV keeps raw OCR conf.
const ANCHORS = [[0,.30],[.10,.70],[.14,.88],[.18,.94],[.22,.98],[1,.99]];
function confidence(v) {
  if (v <= ANCHORS[0][0]) return ANCHORS[0][1];
  for (let i = 0; i < ANCHORS.length - 1; i++) {
    const [c0, p0] = ANCHORS[i], [c1, p1] = ANCHORS[i + 1];
    if (v <= c1) return p0 + (v - c0) * (p1 - p0) / (c1 - c0);
  }
  return ANCHORS[ANCHORS.length - 1][1];
}
async function refreshLog() {
  try {
    const r = await fetch("/plates.csv?_=" + Date.now(), {cache:"no-store"});
    const rows = (await r.text()).trim().split(/\r?\n/).slice(1);
    const last = rows.slice(-15).reverse();
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = last.map(line => {
      const c = line.split(",");
      const klass = c[2] === "PATENTE_ALFANUM" ? "legacy" : "car"; // every logged row is validated (ADR-0009)
      return `<tr class="${klass}">` + c.map((v,i) => `<td>${i === 3 ? (100 * confidence(Number(v))).toFixed(0) + "%" : v}</td>`).join("") + "</tr>";
    }).join("");
  } catch (e) { /* server hiccup; next poll recovers */ }
}
refreshLog();
setInterval(refreshLog, 2000);
</script>
